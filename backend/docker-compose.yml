services:
  db:
    image: postgres:16-alpine
    container_name: estateflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - estateflow_pgdata:/var/lib/postgresql/data

volumes:
  estateflow_pgdata:
